name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The measurement logic lives in pure-Kotlin modules with no Android dependency,
      # so the tests that matter most run here in seconds, on every push.
      - name: Test the geometry and units core
        run: ./gradlew :core:units:test :core:geometry:test --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/*/build/reports/tests/
            core/*/build/test-results/
          retention-days: 7
