# Metaspace raised from 512m: the editor's Robolectric tests load a whole Android
# runtime into the daemon on top of everything the build already holds, and CI began
# reporting the daemon expiring for want of it — which throws away the daemon and
# makes the next build slower.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Only configure the projects a requested task actually needs. This lets the
# pure-Kotlin core be built and tested without configuring the Android modules,
# which matters in environments without an Android SDK.
org.gradle.configureondemand=true

kotlin.code.style=official

# KSP registers its generated sources through the kotlin.sourceSets DSL, which AGP 9's
# built-in Kotlin support rejects by default. This is AGP's own documented escape hatch
# and is needed for Room's annotation processing until KSP registers them the new way.
android.disallowKotlinSourceSets=false
